name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore NuGet packages
        run: dotnet restore "LARGA.sln"

      - name: Provide MapTiler config placeholder
        # MapTilerConfig.cs is gitignored (real key stays local-only, never committed - see
        # MapTilerConfig.cs.example), so a clean CI checkout never has it and the build fails
        # with CS0103 on MapTilerConfig.ApiKey. CI only needs the code to compile, not to
        # actually reach MapTiler, so the placeholder key from the example file is enough.
        run: Copy-Item "LARGA.MobileApp/Services/MapTilerConfig.cs.example" "LARGA.MobileApp/Services/MapTilerConfig.cs"
        shell: pwsh

      - name: Build solution (Release)
        run: dotnet build "LARGA.sln" --configuration Release

      - name: Run tests
        run: dotnet test "LARGA.sln" --configuration Release --no-build --verbosity normal